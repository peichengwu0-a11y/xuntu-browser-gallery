name: Deploy browser image finder
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript
        run: |
          node --check app.js
          node --check bundle.js
          node --check db.js
          node --check search-worker.js
          node --check vision-core.js
          node --check shared-gallery.js
          node --check cos-gallery.js
          node --test tests/cos-gateway.test.cjs
          node --check lightglue-core.js
          node tests/search-stages.test.cjs
          node --check folders.js
          node tests/folders.test.cjs
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html style.css pages.css app.js bundle.js db.js folders.js search-worker.js vision-core.js lightglue-core.js shared-gallery.js cos-gallery.js README.md .nojekyll _site/
          echo '{"apiEndpoint":""}' > _site/cos-config.json
          cp -r vendor _site/vendor
          node scripts/site-previews.cjs stage _site/cos-snapshot
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
