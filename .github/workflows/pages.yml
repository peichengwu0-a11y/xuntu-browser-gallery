name: Deploy browser image finder
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript
        run: |
          node --check app.js
          node --check bundle.js
          node --check db.js
          node --check search-worker.js
          node --check vision-core.js
          node --check shared-gallery.js
          node --check cos-gallery.js
          node --test tests/cos-gateway.test.cjs
          node --check lightglue-core.js
          node tests/search-stages.test.cjs
          node --check folders.js
          node tests/folders.test.cjs
      - name: Prepare static files
        env:
          XUNTU_COS_API: ${{ vars.XUNTU_COS_API }}
        run: |
          mkdir _site
          cp index.html style.css pages.css app.js bundle.js db.js folders.js search-worker.js vision-core.js lightglue-core.js shared-gallery.js cos-gallery.js README.md .nojekyll _site/
          node -e "const c=require('./cos-config.json'); c.apiEndpoint=process.env.XUNTU_COS_API || c.apiEndpoint; require('node:fs').writeFileSync('_site/cos-config.json',JSON.stringify(c))"
          cp -r vendor _site/vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
